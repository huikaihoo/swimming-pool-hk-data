name: Consolidate data updates

on:
  schedule:
    - cron: "10 23 * * *"
      timezone: Asia/Hong_Kong

permissions:
  contents: write

concurrency:
  group: swimming-pool-hk-data-updates
  cancel-in-progress: false

jobs:
  consolidate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Squash today's data update commits
        run: ./scripts/consolidate-data.sh
